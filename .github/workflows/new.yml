name: New app deploy
on:
  push:
    branches:
      - master

env:
  DOCKERIMAGE: aase24/mohamed:gha

jobs:
  build-and-test-app:
    runs-on: ubuntu-latest

    steps:
      - name: code checkout
        uses: actions/checkout@v7
      - name: install java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'  
      - name: Build the app
        run: mvn clean install -DskipTests=true
      - name: Test the app
        run: mvn test
      - name: docker image build
        run: docker build -t $DOCKERIMAGE .
      - name: docker login
        uses: docker/login-action@v3
        with:
          username: ${{vars.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}
      - name: docker image push
        run: docker push $DOCKERIMAGE
  deploy-the-app:
    needs: build-and-test-app
    runs-on: ubuntu-latest
    steps:
      - name: server ssh
        uses: appleboy/ssh-action@v1
        with:
          host: ${{vars.HOST}}
          username: ubuntu
          key: ${{secrets.KEY}}
          port: 22
          script: |
            docker pull ${{env.DOCKERIMAGE}}
            
