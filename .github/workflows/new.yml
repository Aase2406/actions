name: New app deploy
on:
  push:
    branches:
      - master

jobs:
  build-and-test-app:
    runs-on: ubuntu-latest

    steps:
      - name: code checkout
        uses: actions/checkout@v7
      - name: Build the app
        run: mvn clean install -DskipTests=true
      - name: Test the app
        run: mvn test
